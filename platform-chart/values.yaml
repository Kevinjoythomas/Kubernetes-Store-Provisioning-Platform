# Default values for store-platform chart
# This chart deploys the Store Provisioning Platform components

# Global settings
global:
  imagePullSecrets: []

# Naming overrides
nameOverride: ""
fullnameOverride: ""

# Base domain for store ingress URLs
baseDomain: "local.store"

# Platform namespace (where platform components are deployed)
platformNamespace: "store-platform"

# Namespace creation
namespace:
  create: true

# Store CRD
storeCRD:
  create: true

# Controller RBAC
rbac:
  create: true

# API (Flask backend)
api:
  enabled: true
  replicaCount: 1

  image:
    repository: store-platform-api
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000

  serviceAccount:
    create: true
    name: store-api

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  env:
    - name: FLASK_ENV
      value: "production"
    - name: FLASK_APP
      value: "app.py"
    - name: PLATFORM_NAMESPACE
      value: "store-platform"
    - name: K8S_IN_CLUSTER
      value: "true"
    - name: BASE_DOMAIN
      value: "local.store"

# Dashboard (React frontend)
dashboard:
  enabled: true
  replicaCount: 1

  image:
    repository: store-platform-dashboard
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  env:
    - name: REACT_APP_API_URL
      value: "http://api.local.store"

# Controller (kopf-based operator)
controller:
  enabled: true
  replicaCount: 1

  image:
    repository: store-platform-controller
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  serviceAccount:
    create: true
    name: store-controller

  env:
    - name: STORE_CHART_PATH
      value: "/charts/store-chart"
    - name: BASE_DOMAIN
      value: "local.store"
    - name: PLATFORM_NAMESPACE
      value: "store-platform"

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"

  hosts:
    - host: api.local.store
      paths:
        - path: /
          pathType: Prefix
          service: api
          port: 5000
    - host: dashboard.local.store
      paths:
        - path: /
          pathType: Prefix
          service: dashboard
          port: 80

  tls: []
  # - secretName: platform-tls
  #   hosts:
  #     - api.local.store
  #     - dashboard.local.store
