{{- if .Values.storeCRD.create -}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stores.platform.urumi.io
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  group: platform.urumi.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                storeType:
                  type: string
                  enum: ["woocommerce", "medusa"]
                  description: "Type of store engine to provision"
                displayName:
                  type: string
                  description: "Human-readable name for the store"
                baseDomain:
                  type: string
                  description: "Base domain for store ingress (e.g., local.store)"
              required: ["storeType"]
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Provisioning", "Installing", "Configuring", "Ready", "Failed", "Deleting"]
                  description: "Current phase of store lifecycle"
                url:
                  type: string
                  description: "Public URL of the store"
                adminUrl:
                  type: string
                  description: "Admin panel URL"
                message:
                  type: string
                  description: "Human-readable status message"
                createdAt:
                  type: string
                  format: date-time
                  description: "Timestamp when store was created"
                readyAt:
                  type: string
                  format: date-time
                  description: "Timestamp when store became ready"
                events:
                  type: array
                  description: "Event log for store lifecycle"
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          description: "Store engine type"
          jsonPath: .spec.storeType
        - name: Phase
          type: string
          description: "Current lifecycle phase"
          jsonPath: .status.phase
        - name: URL
          type: string
          description: "Store URL"
          jsonPath: .status.url
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: stores
    singular: store
    kind: Store
    shortNames:
      - st
{{- end }}
