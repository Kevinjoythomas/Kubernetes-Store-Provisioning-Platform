{{- if .Values.dashboard.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.fullname" . }}-dashboard
  namespace: {{ include "platform.namespace" . }}
  labels:
    {{- include "platform.dashboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
  - name: http
    port: {{ .Values.dashboard.service.port }}
    targetPort: {{ .Values.dashboard.service.targetPort }}
    protocol: TCP
  selector:
    {{- include "platform.dashboard.selectorLabels" . | nindent 4 }}
{{- end }}
