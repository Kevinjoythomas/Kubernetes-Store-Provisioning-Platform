{{- if .Values.controller.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-controller
  namespace: {{ include "platform.namespace" . }}
  labels:
    {{- include "platform.controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "platform.controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.controller.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "platform.controller.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: controller
        image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
        imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
        env:
        {{- range .Values.controller.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.controller.resources | nindent 10 }}
{{- end }}
