{{- /*
MariaDB Secret with idempotent password generation
Uses lookup to check if secret already exists, preserving passwords across upgrades
*/ -}}
{{- $secretName := printf "%s-mariadb" (include "store.fullname" .) }}
{{- $secretNamespace := include "store.namespace" . }}
{{- $existingSecret := lookup "v1" "Secret" $secretNamespace $secretName }}
{{- $mariadbRootPassword := "" }}
{{- $mariadbPassword := "" }}

{{- if $existingSecret }}
  {{- /* Secret exists, preserve existing passwords */ -}}
  {{- $mariadbRootPassword = index $existingSecret.data "mariadb-root-password" | b64dec }}
  {{- $mariadbPassword = index $existingSecret.data "mariadb-password" | b64dec }}
{{- else }}
  {{- /* Secret doesn't exist, generate new passwords */ -}}
  {{- $mariadbRootPassword = randAlphaNum 16 }}
  {{- $mariadbPassword = randAlphaNum 16 }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "store.namespace" . }}
  labels:
    {{- include "store.mariadb.labels" . | nindent 4 }}
type: Opaque
data:
  mariadb-root-password: {{ $mariadbRootPassword | b64enc | quote }}
  mariadb-password: {{ $mariadbPassword | b64enc | quote }}
  mariadb-user: {{ .Values.mariadb.auth.username | b64enc | quote }}
  mariadb-database: {{ .Values.mariadb.auth.database | b64enc | quote }}
