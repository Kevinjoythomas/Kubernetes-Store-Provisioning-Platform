{{- /*
WordPress Secret with idempotent password generation
Uses lookup to check if secret already exists, preserving passwords across upgrades
*/ -}}
{{- $secretName := printf "%s-wordpress" (include "store.fullname" .) }}
{{- $secretNamespace := include "store.namespace" . }}
{{- $existingSecret := lookup "v1" "Secret" $secretNamespace $secretName }}
{{- $adminPassword := "" }}

{{- if $existingSecret }}
  {{- /* Secret exists, preserve existing password */ -}}
  {{- $adminPassword = index $existingSecret.data "admin-password" | b64dec }}
{{- else }}
  {{- /* Secret doesn't exist, generate new password */ -}}
  {{- $adminPassword = randAlphaNum 16 }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "store.namespace" . }}
  labels:
    {{- include "store.wordpress.labels" . | nindent 4 }}
type: Opaque
data:
  admin-username: {{ .Values.wordpress.admin.username | b64enc | quote }}
  admin-password: {{ $adminPassword | b64enc | quote }}
  admin-email: {{ include "store.wordpress.adminEmail" . | b64enc | quote }}
